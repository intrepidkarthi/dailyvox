<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=1320,height=2868">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1320px;height:2868px;overflow:hidden;font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;background:#0B0B1E}

.bg{position:absolute;inset:0;background:linear-gradient(165deg,#0B0B1E 0%,#0E0E24 30%,#121230 60%,#0A0A18 100%)}

/* Nebula effects */
.nebula{position:absolute;border-radius:50%;filter:blur(100px);opacity:.2}
.n1{width:700px;height:700px;background:radial-gradient(circle,#D4A547,transparent 60%);top:600px;left:100px}
.n2{width:500px;height:500px;background:radial-gradient(circle,#5B7C6B,transparent 60%);top:1200px;right:50px}
.n3{width:600px;height:600px;background:radial-gradient(circle,#7BA4C7,transparent 60%);bottom:600px;left:-100px}
.n4{width:400px;height:400px;background:radial-gradient(circle,#C4736B,transparent 60%);top:300px;right:-80px}

/* Stars */
.star{position:absolute;border-radius:50%;z-index:2}
.star::after{content:'';position:absolute;inset:-250%;border-radius:50%;background:radial-gradient(circle,currentColor,transparent 55%);opacity:.25}

/* Connection lines */
svg.lines{position:absolute;inset:0;width:100%;height:100%;z-index:1}

/* Core star */
.core{position:absolute;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,#F4EEE0,#D4A547 40%,transparent 70%);z-index:3;top:1350px;left:50%;transform:translateX(-50%);box-shadow:0 0 60px rgba(212,165,71,.6),0 0 120px rgba(212,165,71,.3)}
.core::after{content:'';position:absolute;inset:-100%;border-radius:50%;background:radial-gradient(circle,rgba(212,165,71,.15),transparent 50%)}

/* Cluster labels */
.lbl{position:absolute;font-size:32px;color:rgba(244,238,224,.12);font-weight:700;letter-spacing:6px;text-transform:uppercase;z-index:2}

/* Content overlay */
.content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;z-index:4;padding:100px 80px 100px}

.top-text{text-align:center}
h1{color:#fff;font-size:120px;font-weight:800;letter-spacing:-5px;line-height:.92}
h1 span{background:linear-gradient(135deg,#D4A547,#E8C86A);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{margin-top:32px;color:rgba(255,255,255,.45);font-size:44px;line-height:1.4}

/* Bottom info */
.bottom{display:flex;flex-direction:column;align-items:center;gap:40px}
.count{font-size:40px;color:rgba(244,238,224,.5);font-weight:500}
.legend{display:flex;gap:48px}
.leg{display:flex;align-items:center;gap:14px;font-size:34px;color:rgba(244,238,224,.45);font-weight:500}
.ldot{width:18px;height:18px;border-radius:50%}

/* Stats bar */
.stats-bar{display:flex;gap:20px;width:100%}
.sbar{flex:1;background:rgba(244,238,224,.06);border:1px solid rgba(244,238,224,.08);border-radius:28px;padding:36px 20px;text-align:center;backdrop-filter:blur(10px)}
.sbar-val{font-size:56px;font-weight:800;color:#D4A547}
.sbar-lbl{font-size:26px;color:rgba(244,238,224,.35);font-weight:600;margin-top:6px}

.brand{font-size:32px;color:rgba(244,238,224,.12);font-weight:600;letter-spacing:8px;text-transform:uppercase}
</style></head><body>
