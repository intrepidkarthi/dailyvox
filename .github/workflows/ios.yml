name: Build & Test (iOS)

# The website lives at repo-root website/, outside this filter, so blog and SEO
# commits do not trigger a macos-15 Xcode build. The iOS app is ios/; the Android
# sibling gets its own workflow rather than sharing this one.
on:
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
  push:
    branches: [main]
    paths:
      - 'ios/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (iOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Build
        run: |
          xcodebuild build \
            -project ios/solyn.xcodeproj \
            -scheme solyn \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project ios/solyn.xcodeproj \
            -scheme solyn \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:solynTests \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
