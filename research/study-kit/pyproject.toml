[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dailyvox-study"
version = "0.1.0"
description = "Run the DailyVox K-curve study on your own laptop; share only a numbers-only result file."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Karthikeyan NG" }]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
dailyvox-study = "dailyvox_study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dailyvox_study.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: needs the embedding model (downloads ~90 MB on first run; skip offline with -m 'not model')",
]
