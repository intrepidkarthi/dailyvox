included:
  - ios/solyn
  - ios/solynTests

excluded:
  - ios/build
  - ios/solyn/Preview Content

disabled_rules:
  - trailing_whitespace
  - todo

opt_in_rules:
  - empty_count
  - closure_spacing
  - force_unwrapping
  - implicit_return
  - modifier_order

line_length:
  warning: 150
  error: 200

type_body_length:
  warning: 500
  error: 800

file_length:
  warning: 700
  error: 1000

function_body_length:
  warning: 60
  error: 100

identifier_name:
  min_length: 2
  excluded:
    - id
    - x
    - y
    - i
