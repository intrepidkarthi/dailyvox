<!doctype html><meta charset=utf-8>
<!-- Play feature graphic, 1024x500. Rebuilt 2026-09-29 with the vibrant screenshot
     set (screenshot-src/compose.py): same gradient grammar, star dust and marker,
     so the header and the first frame under it read as one listing. Fonts are the
     app's bundled files; render with the command at the bottom of this file. -->
<style>
@font-face{font-family:Nunito;src:url("file:///Users/karthikeyanng/CascadeProjects/voicetotext/android/app/src/main/res/font/nunito_variable.ttf");font-weight:200 1000}
@font-face{font-family:Inter;src:url("file:///Users/karthikeyanng/CascadeProjects/voicetotext/android/app/src/main/res/font/inter_variable.ttf");font-weight:100 900}
@font-face{font-family:DMMono;src:url("file:///Users/karthikeyanng/CascadeProjects/voicetotext/android/app/src/main/res/font/dm_mono_medium.ttf")}
*{margin:0;box-sizing:border-box}
.f{width:1024px;height:500px;position:relative;overflow:hidden;font-family:Nunito,sans-serif;
   background:linear-gradient(120deg,#E8432A 0%,#F0612E 30%,#7B35F0 78%,#3B24C9 100%)}
.f:before{content:"";position:absolute;inset:0;
   background:radial-gradient(520px 420px at 8% 0%,rgba(255,255,255,.22),transparent 70%),
              radial-gradient(600px 500px at 82% 60%,rgba(255,201,77,.22),transparent 70%)}
.dust{position:absolute;inset:0;opacity:.5;
   background-image:radial-gradient(circle,rgba(255,255,255,.8) 1.3px,transparent 2px),
                    radial-gradient(circle,rgba(255,255,255,.45) 1px,transparent 1.7px);
   background-size:97px 91px,61px 67px;background-position:9px 17px,37px 5px}
.wrap{position:absolute;left:60px;top:70px;width:620px;z-index:3}
.brand{display:flex;align-items:center;gap:16px}
.brand img{width:64px;height:64px;border-radius:16px;box-shadow:0 10px 24px -8px rgba(0,0,0,.45)}
.brand span{font-weight:900;font-size:34px;color:#fff;letter-spacing:-.02em}
h1{margin-top:30px;color:#fff;font-weight:900;font-size:50px;line-height:1.04;letter-spacing:-.03em}
mark{background:#FFE45C;color:#14201B;padding:0 12px 4px;border-radius:14px;display:inline-block;
     transform:rotate(-1.6deg);margin-top:6px;box-shadow:0 12px 26px -12px rgba(0,0,0,.5)}
.sub{margin-top:22px;font-family:Inter,sans-serif;font-weight:600;font-size:21px;color:rgba(255,255,255,.92)}
.dev{position:absolute;right:70px;top:48px;width:300px;border-radius:40px;background:#0B0F14;padding:8px;z-index:3;
     transform:rotate(6deg);box-shadow:0 40px 80px -24px rgba(0,0,0,.6)}
.dev div{border-radius:33px;overflow:hidden;height:560px}
.dev img{width:100%;display:block}
</style>
<div class=f>
  <div class=dust></div>
  <div class=wrap>
    <div class=brand><img src="icon-512.png"><span>DailyVox</span></div>
    <h1>Speak for 42 seconds.<br><mark>It stays on your phone.</mark></h1>
    <div class=sub>A private voice diary, and a Twin that learns you.</div>
  </div>
  <div class=dev><div><img src="../screenshot-src/03-twin.png"></div></div>
</div>
